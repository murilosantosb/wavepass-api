server:
  port: ${PORT:8080}

spring:
  application:
    name: wavePass

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jackson:
    mapper:
      accept-case-insensitive-enums: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

api:
  security:
    token:
      secret: ${JWT_SECRET}
    master:
      email: ${WAVEPASS_MASTER_EMAIL}
      password: ${WAVEPASS_MASTER_PASSWORD}