spring:
  application:
    name: wavePass

  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3306/wavepass_db?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    mapper:
      accept-case-insensitive-enums: true

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        replay-reasoning-content: false
        options:
          model: openai/gpt-oss-20b
          temperature: 0.7

  model:
    chat: openai

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

api:
  security:
    token:
      secret: ${JWT_SECRET}
