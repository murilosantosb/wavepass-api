server:
  port: ${PORT:8080}

spring:
  application:
    name: wavePass

  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/wavepass_db?createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    mapper:
      accept-case-insensitive-enums: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

api:
  security:
    token:
      secret: ${JWT_SECRET}
