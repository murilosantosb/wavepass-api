spring:
  application:
    name: wavePass

  datasource:
    username: wavepass_user
    password: wavepass123
    url: jdbc:mysql://localhost:3306/wavepass_db?serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    mapper:
      accept-case-insensitive-enums: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true